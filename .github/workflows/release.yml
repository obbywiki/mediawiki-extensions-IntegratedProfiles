name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    if: github.repository_owner == 'obbywiki'
    uses: obbywiki/shared-workflows/.github/workflows/release-please.yml@v2
    secrets:
      client-id: ${{ secrets.OW_BOT_CLIENT_ID }}
      private-key: ${{ secrets.OW_BOT_PRIVATE_KEY }}
